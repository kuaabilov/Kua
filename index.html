<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f8fc"><meta name="description" content="AITU attendance planner: Moodle points, percentages and trimester absence allowance."><title>AITU · Attendance planner</title><link rel="stylesheet" href="style.css?v=planner1"></head>
<body><header class="header"><div class="header-inner"><a href="#main" class="brand" aria-label="AITU Attendance"><span class="brand-icon">a.</span><span>AITU <b>attendance</b></span></a><div class="languages" aria-label="Language / Язык / Тіл"><button data-lang="ru" lang="ru">RU</button><button data-lang="kk" lang="kk">ҚАЗ</button><button data-lang="en" lang="en">EN</button></div></div></header>
<main id="main" class="container"><section class="hero"><span class="eyebrow" data-i18n="tag"></span><h1 data-i18n="headline"></h1><p data-i18n="intro"></p><span class="privacy"><span aria-hidden="true">◉</span> <span data-i18n="private"></span></span></section>
<section class="stats" aria-live="polite"><div><span data-i18n="courses"></span><strong id="stat-count">0</strong></div><div><span data-i18n="average"></span><strong id="stat-average">—</strong></div><div><span data-i18n="risk"></span><strong id="stat-risk">0</strong></div></section>
<section class="guide"><div><h3 data-i18n="step1"></h3><p data-i18n="step1body"></p></div><div><h3 data-i18n="step2"></h3><p data-i18n="step2body"></p></div><div><h3 data-i18n="step3"></h3><p data-i18n="step3body"></p></div></section>
<section class="panel" aria-labelledby="table-title"><div class="panel-heading"><div><h2 id="table-title" data-i18n="tableTitle"></h2><p data-i18n="tableSub"></p></div><button class="secondary" id="example" data-i18n="example"></button></div><div class="toolbar"><div class="modes"><button data-mode="points" data-i18n="pointsMode"></button><button data-mode="percent" data-i18n="percentMode"></button></div><label class="threshold"><span data-i18n="threshold"></span><input id="threshold" type="number" min="0" max="100" step="any" value="70" required><span>%</span></label></div>
<p id="threshold-error" class="error toolbar-error" hidden data-i18n="thresholdError"></p>
<div class="table-scroll"><table><thead><tr><th data-i18n="course"></th><th><span data-i18n="held"></span><small>Taken sessions</small></th><th><span id="input-heading"></span><small id="input-subheading"></small></th><th data-i18n="rate"></th><th data-i18n="missed"></th><th data-i18n="total"></th><th data-i18n="left"></th><th><span class="sr-only" data-i18n="remove"></span></th></tr></thead><tbody id="courses"></tbody></table></div>
<div class="panel-bottom"><button class="primary" id="add" data-i18n="add"></button><button class="text-button" id="undo" hidden data-i18n="undo"></button><span id="save-state" data-i18n="saved"></span></div><p id="limit-message" class="error toolbar-error" hidden data-i18n="limit"></p></section>
<section class="explanation"><h2 data-i18n="exactHeading"></h2><div class="explanation-grid"><article><span class="explanation-number">01</span><h3 data-i18n="equivNote"></h3><p data-i18n="equivBody"></p></article><article><span class="explanation-number">02</span><h3 data-i18n="forecastNote"></h3><p data-i18n="forecastBody"></p></article><article><span class="explanation-number">03</span><h3 data-i18n="percentNote"></h3><p data-i18n="percentBody"></p></article></div></section>
