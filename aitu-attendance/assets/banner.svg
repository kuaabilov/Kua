<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">AITU Attendance — калькулятор пропусков</title><desc id="desc">Планируй триместр. Считай пропуски. Пример: 30 занятий, порог 70%, лимит 9 пропусков.</desc>
<rect width="1200" height="380" rx="24" fill="#10121a"/>
<circle cx="1130" cy="30" r="220" fill="none" stroke="#292b38"/><circle cx="1130" cy="30" r="160" fill="none" stroke="#292b38"/>
<rect x="52" y="44" width="52" height="52" rx="26" fill="#d2ff3d"/><text x="78" y="80" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#10121a">A</text>
<text x="122" y="76" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#d2ff3d">AITU / ATTENDANCE</text>
<text x="52" y="159" font-family="Arial,sans-serif" font-size="50" font-weight="700" fill="#fffefa">Твой триместр.</text>
<text x="52" y="220" font-family="Arial,sans-serif" font-size="50" font-weight="700" fill="#a99dff">Твой контроль.</text>
<text x="54" y="267" font-family="Arial,sans-serif" font-size="18" fill="#bfc0ca">Калькулятор пропусков по каждому предмету</text>
<text x="54" y="332" font-family="Arial,sans-serif" font-size="14" fill="#9396a7">В БРАУЗЕРЕ  /  БЕЗ УСТАНОВКИ  /  НА ТВОЁМ ПК</text>
<rect x="746" y="94" width="396" height="224" rx="18" fill="#202330" stroke="#383b48"/>
<text x="775" y="131" font-family="Arial,sans-serif" font-size="12" letter-spacing="2" fill="#bfc0ca">ПРИМЕР РАСЧЁТА</text>
<text x="775" y="218" font-family="Arial,sans-serif" font-size="80" font-weight="700" fill="#d2ff3d">9</text>
<text x="843" y="207" font-family="Arial,sans-serif" font-size="21" fill="#fffefa">пропусков максимум</text>
<rect x="776" y="245" width="336" height="5" rx="2" fill="#45495a"/><rect x="776" y="245" width="101" height="5" rx="2" fill="#d2ff3d"/>
<text x="775" y="285" font-family="Arial,sans-serif" font-size="15" fill="#bfc0ca">30 занятий · посещаемость не ниже 70%</text>
</svg>
